model:
  noise_predictor_path: "pretrained/noise_predictor_v3.safetensors"
  residual_path: "pretrained/residual.safetensors"
  resshift_path: "pretrained/resshift_realsrx4_s4_v3.pth"
  vae_path: "pretrained/autoencoder_vq_f4.pth"

resshift_unet:
  image_size: 64
  in_channels: 3
  model_channels: 160
  out_channels: 3
  attention_resolutions: [64, 32, 16, 8]
  channel_mult: [1, 2, 2, 4]
  num_res_blocks: [2, 2, 2, 2]
  num_head_channels: 32
  use_scale_shift_norm: true
  resblock_updown: false
  swin_depth: 2
  swin_embed_dim: 192
  window_size: 8
  mlp_ratio: 4
  cond_lq: true
  lq_size: 64
  dropout: 0.0
  use_fp16: false
  conv_resample: true
  dims: 2
  patch_norm: false

noise_predictor:
  config_path: "configs/noise_predictor_config.yaml"

diffusion:
  num_timesteps: 4
  kappa: 2.0
  eta_schedule: "exponential"
  eta_power: 0.3
  min_noise_level: 0.2
  etas_end: 0.99
  normalize_input: true
  latent_flag: true

inference:
  num_steps: 4
  scale_factor: 4

  # Sampling pipeline:
  # 'origin'          = original ResShift (standard Gaussian posterior noise),
  # 'noise_predictor' = the predictor's output distribution replaces standard
  #                     Gaussian as the posterior sampling noise,
  # 'residual'        = residual corrector (checkpoint at model.residual_path)
  mode: "noise_predictor"

  color_correction: true

  padding_offset: 64

  chop_size: 128
  chop_stride: 64
  chop_bs: 1

  device: "cuda"
  use_amp: true
  seed: 12345

  rgb2bgr: true
