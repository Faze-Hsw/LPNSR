experiment:
  save_dir: "experiments/noise_predictor"
  save_freq: 5000
  keep_last_n: 3

resshift:
  vae_path: "pretrained/stable-diffusion-2-1-base"
  denoiser_path: "pretrained/denoiser_step100000.safetensors"

# Frozen denoiser structure (consumes scale(x_t), lq = LR latent)
model_params:
  image_size: 64
  in_channels: 4
  model_channels: 160
  out_channels: 4
  attention_resolutions: [64, 32, 16, 8]
  channel_mult: [1, 2, 2, 4]
  num_res_blocks: [2, 2, 2, 2]
  num_head_channels: 32
  use_scale_shift_norm: true
  resblock_updown: false
  swin_depth: 2
  swin_embed_dim: 192
  window_size: 8
  mlp_ratio: 4
  cond_lq: true
  lq_size: 64
  dropout: 0.0
  use_fp16: false
  conv_resample: true
  dims: 2
  patch_norm: false

# Noise predictor structure (same UNet backbone, independent config):
# input = cat(scale(x_t), pred_x0) => in_channels = 2 * model_params.in_channels,
# lq = LR latent via cond_lq; output = residual r = x_0 - x'_0
# => out_channels = model_params.out_channels (latent channels)
noise_predictor_params:
  image_size: 64
  in_channels: 8
  model_channels: 96
  out_channels: 4
  attention_resolutions: [64, 32, 16, 8]
  channel_mult: [1, 2, 2, 4]
  num_res_blocks: [2, 2, 2, 2]
  num_head_channels: 32
  use_scale_shift_norm: true
  resblock_updown: false
  swin_depth: 2
  swin_embed_dim: 192
  window_size: 8
  mlp_ratio: 4
  cond_lq: true
  lq_size: 64
  lq_channels: 4
  dropout: 0.0
  use_fp16: false
  conv_resample: true
  dims: 2
  patch_norm: false

training:
  iterations: 200000
  batch_size: 16
  num_workers: 8
  ema_rate: 0.999
  gradient_accumulation_steps: 1

  diffusion:
    num_timesteps: 15
    kappa: 2.0
    eta_schedule: "exponential"
    min_noise_level: 0.04
    etas_end: 0.99
    eta_power: 0.3
    normalize_input: true
    latent_flag: true

  use_amp: true
  use_gradient_checkpointing: false
  gradient_clip: 1.0

data:
  train:
    hr_dir: "traindata"
    crop_size: 512
    scale: 4
    use_flip: true
    use_rot: true

degradation:
  use_degradation: true
  config_path: "configs/realesrgan_degradation.yaml"

validation:
  enabled: true
  lq_dir: "assets/validate_lq"
  gt_dir: "assets/validate_gt"
  scale: 4.0

optimizer:
  type: "AdamW"
  lr: 5.0e-5
  beta1: 0.9
  beta2: 0.999
  weight_decay: 0

# type: "none" = constant lr; CosineAnnealing uses min_lr; StepLR uses step_size/gamma
scheduler:
  type: "none"
  min_lr: 1.0e-5
  step_size: 50000
  gamma: 0.5
